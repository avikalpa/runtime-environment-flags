name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Update npm
        run: npm install -g npm@latest

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Run tests
        run: bun test

      - name: Generate curated release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ./scripts/release-notes.sh "${{ github.event.release.tag_name }}" > RELEASE_NOTES.md
          gh release edit "${{ github.event.release.tag_name }}" --notes-file RELEASE_NOTES.md --repo "${{ github.repository }}"

      - name: Publish
        run: npm publish --provenance --access public
